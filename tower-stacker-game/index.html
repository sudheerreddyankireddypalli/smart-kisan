<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky High Stack: Isometric Tower Rush</title>
    <!-- Favicon & Web App Meta -->
    <meta name="theme-color" content="#0b0f19">
    <meta name="description" content="Precision tower building game. Stack blocks sky-high with perfect rhythm!">
    <link rel="stylesheet" href="style.css">
    
    <!-- Optional: CrazyGames SDK Loader (Works automatically when hosted on CrazyGames) -->
    <!-- <script src="https://sdk.crazygames.com/crazygames-sdk-v2.js"></script> -->
</head>
<body>
    <div id="game-container">
        <!-- Render Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Layer -->
        <div id="hud">
            <div class="hud-buttons hud-item">
                <button id="sound-btn" class="icon-btn" title="Toggle Sound">🔊</button>
                <button id="shop-btn" class="icon-btn" title="Block Skins">🎨</button>
            </div>

            <div class="score-display">
                <div id="current-score">0</div>
                <div id="combo-pill" class="combo-text">PERFECT x1</div>
            </div>

            <div class="coin-pill hud-item">
                <span class="coin-icon">★</span>
                <span id="coin-counter">0</span>
            </div>
        </div>

        <div id="tap-hint" class="tap-prompt">TAP OR PRESS SPACE TO PLACE</div>

        <!-- Start Screen -->
        <div id="start-screen" class="modal-overlay active">
            <div class="card">
                <h1 class="title">SKY HIGH</h1>
                <p class="subtitle">Precision Isometric Stacker</p>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Best Tower</div>
                        <div id="menu-best-score" class="stat-value">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Coins</div>
                        <div id="menu-coins" class="stat-value">0</div>
                    </div>
                </div>
                <button id="start-btn" class="btn-primary">▶ TAP TO START</button>
                <button id="menu-shop-btn" class="btn-secondary">CUSTOM SKINS</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="modal-overlay">
            <div class="card">
                <h2 class="title">TOWER FELL!</h2>
                <p class="subtitle">Great effort! Can you beat your record?</p>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Tower Height</div>
                        <div id="final-score" class="stat-value">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Record</div>
                        <div id="final-best" class="stat-value">0</div>
                    </div>
                </div>

                <!-- High-Revenue Rewarded Ad Placements -->
                <button id="revive-btn" class="btn-reward">
                    <span>❤️</span> REVIVE TOWER (WATCH AD)
                </button>
                <button id="double-coins-btn" class="btn-reward" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                    <span>⭐</span> 2X COINS (WATCH AD)
                </button>
                
                <button id="restart-btn" class="btn-primary">PLAY AGAIN</button>
            </div>
        </div>

        <!-- Shop Screen -->
        <div id="shop-screen" class="modal-overlay">
            <div class="card">
                <h2 class="title">BLOCK STYLES</h2>
                <p class="subtitle">Unlock vibrant themes with earned coins</p>
                <div class="skins-grid" id="skins-container">
                    <!-- Populated by game.js -->
                </div>
                <button id="close-shop-btn" class="btn-primary">BACK TO GAME</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="ads.js"></script>
    <script src="game.js"></script>
</body>
</html>
